version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: demo_postgres
    environment:
      POSTGRES_USER: nestuser
      POSTGRES_PASSWORD: nestpassword
      POSTGRES_DB: zod_demo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestuser -d zod_demo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: demo_nestjs_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://nestuser:nestpassword@postgres:5432/zod_demo_db?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:
